name: sub-web

services:
  subconverter:
    image: registry.mgxnet.com/mgx/subconverter-mgx:20260808-surge-realip1
    pull_policy: missing
    container_name: sub-web-subconverter
    restart: unless-stopped
    expose:
      - "25500"
    security_opt:
      - no-new-privileges:true

  sub-web:
    image: registry.mgxnet.com/mgx/sub-web:latest
    pull_policy: missing
    container_name: sub-web
    restart: unless-stopped
    depends_on:
      - subconverter
    ports:
      - "192.168.31.4:8090:80"
    security_opt:
      - no-new-privileges:true
